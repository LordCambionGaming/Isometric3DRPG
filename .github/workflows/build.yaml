name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release (es. v1.0.0), lascia vuoto per non creare release'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev libx11-dev libxrandr-dev libxi-dev \
          libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

    - name: Build
      run: cmake --build build --config Release

    - name: Locate executable (Linux)
      if: runner.os == 'Linux'
      run: find build -name Isometric3DRPG -type f

    - name: Locate executable (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Get-ChildItem -Path build -Recurse -Filter Isometric3DRPG.exe | Select-Object FullName

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p dist
        EXE=$(find build -name Isometric3DRPG -type f | head -1)
        cp "$EXE" dist/
        
        # Cerca automaticamente la cartella assets nel repository (escludendo la cartella build)
        ASSETS_DIR=$(find . -name "assets" -type d | grep -v "build" | head -1)
        if [ -n "$ASSETS_DIR" ]; then
          echo "Trovata cartella assets in: $ASSETS_DIR"
          cp -r "$ASSETS_DIR" dist/
        else
          echo "Attenzione: cartella assets non trovata!"
        fi
        
        tar -czf Isometric3DRPG-linux.tar.gz -C dist .

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        $exe = Get-ChildItem -Path build -Recurse -Filter Isometric3DRPG.exe | Select-Object -First 1
        Copy-Item $exe.FullName dist/
        
        # Cerca automaticamente la cartella assets nel repository (escludendo la cartella build)
        $assets = Get-ChildItem -Path . -Recurse -Filter "assets" -Directory | Where-Object { $_.FullName -notmatch "build" } | Select-Object -First 1
        if ($assets) {
            Write-Host "Trovata cartella assets in: $($assets.FullName)"
            Copy-Item -Recurse $assets.FullName dist/
        } else {
            Write-Warning "Attenzione: cartella assets non trovata!"
        }
        
        Compress-Archive -Path dist/* -DestinationPath Isometric3DRPG-windows.zip

    - uses: actions/upload-artifact@v4
      with:
        name: Isometric3DRPG-${{ runner.os }}
        path: |
          Isometric3DRPG-linux.tar.gz
          Isometric3DRPG-windows.zip
        if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -laR artifacts

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ github.sha }}
        files: artifacts/**/*
        generate_release_notes: true
